<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EE Connections</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Title bar drag region -->
    <div class="titlebar">
      <span class="titlebar-text">⚡ EE Connections</span>
    </div>

    <!-- Stats bar -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="streak">0</span>
        <span class="stat-label">Streak</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="accuracy">0%</span>
        <span class="stat-label">Accuracy</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="total">0</span>
        <span class="stat-label">Answered</span>
      </div>
    </div>

    <!-- View switcher -->
    <div class="view-tabs" role="tablist">
      <button class="view-tab active" id="tab-today" role="tab" aria-selected="true">Today</button>
      <button class="view-tab" id="tab-board" role="tab" aria-selected="false">🏆 Leaderboard</button>
    </div>

    <!-- Leaderboard (hidden by default) -->
    <div class="board-card hidden" id="board-card" role="tabpanel" aria-labelledby="tab-board">
      <div class="board-toggle" role="group" aria-label="Leaderboard period">
        <button class="board-period active" id="period-weekly" aria-pressed="true">This week</button>
        <button class="board-period" id="period-alltime" aria-pressed="false">All time</button>
      </div>
      <div class="board-subtitle" id="board-subtitle"></div>
      <ol class="board-list" id="board-list" aria-live="polite"></ol>
      <div class="board-me hidden" id="board-me"></div>
      <div class="board-status" id="board-status">Loading…</div>
    </div>

    <!-- Question card -->
    <div class="question-card" id="question-card">
      <div class="category-badge" id="category-badge">Loading...</div>
      <div class="question-text" id="question-text">Loading today's question...</div>
      <div class="options-container" id="options-container"></div>
    </div>

    <!-- Result card (hidden by default) -->
    <div class="result-card hidden" id="result-card">
      <div class="result-icon" id="result-icon">✓</div>
      <div class="result-text" id="result-text">Correct!</div>
      <div class="explanation" id="explanation"></div>
      <div class="next-question-timer" id="next-timer">Next question tomorrow</div>
    </div>

    <!-- Already answered state -->
    <div class="done-card hidden" id="done-card">
      <div class="done-icon">✅</div>
      <div class="done-text">You've already answered today's question!</div>
      <div class="done-subtext">Come back tomorrow for a new challenge.</div>
      <div class="review-section" id="review-section"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
